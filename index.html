<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INCY Routing Profiles</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      line-height: 1.5;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 25px;
    }

    details {
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 14px;
      padding: 14px 18px;
    }

    summary {
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .description {
      color: #555;
      margin: 12px 0;
    }

    .qr {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .source {
      font-size: 13px;
      color: #666;
      overflow-wrap: anywhere;
    }

    .source a {
      color: #1769aa;
    }
  </style>
</head>

<body>

  <h1>INCY Routing Profiles</h1>

  <details name="routing-profiles">
    <summary>RU</summary>

    <div class="qr" id="qr-ru"></div>

    <p class="source">
      <a href="incy://autorouting/add/https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/RU.json">
        Add to INCY on PC
      </a>
     </p>
    
    <p class="source">
      Source URL:
      <a href="https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/RU.json">
        RU.json
      </a>
    </p>
  </details>

  <details name="routing-profiles">
    <summary>ABROAD</summary>

    <div class="qr" id="qr-abroad"></div>

    <p class="source">
      <a href="incy://autorouting/add/https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/ABROAD.json">
        Add to INCY om PC
      </a>
    </p>

    <p class="source">
      Source URL:
      <a href="https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/ABROAD.json">
        ABROAD.json
      </a>
    </p>
  </details>

  <script>
    const profiles = [
      {
        id: "qr-ru",
        url: "https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/RU.json"
      },
      {
        id: "qr-abroad",
        url: "https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/ABROAD.json"
      }
    ];

    profiles.forEach(profile => {
      const importUrl = "incy://autorouting/add/" + profile.url;

      new QRCode(document.getElementById(profile.id), {
        text: importUrl,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
      });
    });
  </script>

</body>
</html>
