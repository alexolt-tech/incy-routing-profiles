<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INCY Routing Profiles</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 650px;
    margin: 35px auto;
    padding: 0 16px;
    background: #f5f6f8;
    color: #222;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

details {
    background: white;
    margin: 14px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
    overflow: hidden;
}

summary {
    padding: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 17px;
}

summary:hover {
    background: #f0f3f7;
}

.content {
    padding: 20px;
    border-top: 1px solid #eee;
    text-align: center;
}

.qr {
    display: flex;
    justify-content: center;
    margin: 10px auto 20px;
}

.qr img, .qr canvas {
    max-width: 100%;
    height: auto;
}

.description {
    color: #666;
    font-size: 14px;
}

a {
    color: #1769aa;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.button {
    display: inline-block;
    padding: 10px 18px;
    background: #1769aa;
    color: white;
    border-radius: 6px;
    margin: 8px;
}
</style>
</head>

<body>

<h1>INCY Routing Profiles</h1>

<div id="profiles"></div>

<script>
const profiles = [
    {
        name: "RU_MODE",
        description: "Российские ресурсы напрямую",
        file: "RU_MODE.json"
    },
    {
        name: "ABROAD_MODE_RUONLY",
        description: "Российские ресурсы через VPN, остальные напрямую",
        file: "ABROAD_MODE_RUONLY.json"
    },
    {
        name: "ABROAD_MODE_VPN",
        description: "Весь трафик через VPN",
        file: "ABROAD_MODE_VPN.json"
    }
];

const baseURL =
"https://raw.githubusercontent.com/alexolt-tech/incy-routing-profiles/main/";

const container = document.getElementById("profiles");

profiles.forEach((profile, index) => {
    const sourceURL = baseURL + profile.file;
    const incyURL = "incy://autorouting/add/" + sourceURL;

    const details = document.createElement("details");
    details.name = "routing-profiles";

    const summary = document.createElement("summary");
    summary.textContent = profile.name;

    const content = document.createElement("div");
    content.className = "content";

    const description = document.createElement("p");
    description.className = "description";
    description.textContent = profile.description;

    const qr = document.createElement("div");
    qr.className = "qr";

    const addLink = document.createElement("a");
    addLink.href = incyURL;
    addLink.className = "button";
    addLink.textContent = "Добавить в INCY";

    const source = document.createElement("p");
    source.className = "description";

    const sourceLink = document.createElement("a");
    sourceLink.href = sourceURL;
    sourceLink.target = "_blank";
    sourceLink.rel = "noopener";
    sourceLink.textContent = "Открыть JSON Source";

    source.appendChild(sourceLink);

    content.append(description, qr, addLink, source);
    details.append(summary, content);
    container.appendChild(details);

    new QRCode(qr, {
        text: incyURL,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.M
    });
});
</script>

</body>
</html>
